# La raíz es la carpeta del proyecto, igual que en Laragon: el .htaccess de la raíz
# reenvía todo a public/, y las vistas piden recursos como /public/assets/...
# (con la raíz en public/ esas rutas no existirían).
<VirtualHost *:80>
    DocumentRoot /var/www/html

    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Defensa adicional: estas carpetas nunca se sirven por web, aunque falle el
    # .htaccess. Los uploads se entregan por DescargaController, que valida el rol.
    # `config` NO va en la lista: /config/index es una ruta del sistema (módulo
    # Configuración) y Apache revisa la carpeta antes de reescribir la URL; por eso
    # se protege el archivo en sí, más abajo.
    <DirectoryMatch "^/var/www/html/(app|storage|cron|database|docker|docs|tests)(/|$)">
        Require all denied
    </DirectoryMatch>
    <Files "config.php">
        Require all denied
    </Files>
    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>

    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
