; SIGTUR-IMATUR — ajustes de PHP para el contenedor
date.timezone = America/Caracas
display_errors = Off
log_errors = On
error_log = /dev/stderr

; El sistema acepta documentos de hasta 5 MB y varias evidencias por envío.
upload_max_filesize = 20M
post_max_size = 25M
memory_limit = 512M
max_execution_time = 120

; La expiración por inactividad la controla la aplicación (SESSION_TIMEOUT).
session.gc_maxlifetime = 7200
expose_php = Off
